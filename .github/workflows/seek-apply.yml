name: Seek Auto Apply

on:
  schedule:
    # 6 runs/day, spaced evenly every 4h (UTC). AEST (UTC+10) equivalents:
    # 10:17am, 2:17pm, 6:17pm, 10:17pm, 2:17am, 6:17am — note: times shift 1h
    # during AEDT (Oct–Apr). Raised from 3x/day to spread the daily application
    # budget across more, smaller runs (see MAX_APPS_PER_RUN/MAX_APPS_PER_SEARCH
    # below and lib/daily-cap.ts for the 30/day hard backstop).
    - cron: '17 0 * * *'
    - cron: '17 4 * * *'
    - cron: '17 8 * * *'
    - cron: '17 12 * * *'
    - cron: '17 16 * * *'
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      job_url:
        description: 'SEEK job URL to apply to (leave blank for normal search loop)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — fill but do not submit'
        required: false
        type: boolean
        default: false

concurrency:
  group: seek-apply
  cancel-in-progress: false

jobs:
  apply:
    # Schedule always fires on the default branch (main). This guard also
    # prevents accidental workflow_dispatch runs from develop or feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'google/gemini-2.5-flash'
      SEEK_EMAIL: ${{ secrets.SEEK_EMAIL }}
      SEEK_SESSION_COOKIES: ${{ secrets.SEEK_SESSION_COOKIES }}
      CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      CANDIDATE_LINKEDIN: ${{ secrets.CANDIDATE_LINKEDIN }}
      CANDIDATE_WEBSITE: ${{ secrets.CANDIDATE_WEBSITE }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}
      WORKDAY_PASSWORD_FALLBACK: ${{ secrets.WORKDAY_PASSWORD_FALLBACK }}
      INDEED_ENABLED: 'false'
      # Lowered from 100/30 now that this workflow runs 6x/day instead of 3x —
      # the real backstop is the 30/day hard cap in lib/daily-cap.ts (persisted
      # via the cache step below), but a single run should not be able to blow
      # through most of that budget by itself.
      MAX_APPS_PER_RUN: '10'
      MAX_APPS_PER_SEARCH: '5'
      RESUME_TAILORING_ENABLED: 'true'
      AUTO_SUBMIT_ENABLED: 'true'
      DRY_RUN: 'false'
      LOG_LEVEL: 'info'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system deps
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          {
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "OPENROUTER_MODEL=${OPENROUTER_MODEL}"
            echo "SEEK_EMAIL=${SEEK_EMAIL}"
            echo "CANDIDATE_PHONE=${CANDIDATE_PHONE}"
            echo "CANDIDATE_LINKEDIN=${CANDIDATE_LINKEDIN}"
            echo "CANDIDATE_WEBSITE=${CANDIDATE_WEBSITE}"
            echo "WORKDAY_PASSWORD=${WORKDAY_PASSWORD}"
            echo "WORKDAY_PASSWORD_FALLBACK=${WORKDAY_PASSWORD_FALLBACK}"
            echo "MAX_APPS_PER_RUN=${MAX_APPS_PER_RUN}"
            echo "MAX_APPS_PER_SEARCH=${MAX_APPS_PER_SEARCH}"
            echo "RESUME_TAILORING_ENABLED=${RESUME_TAILORING_ENABLED}"
            echo "AUTO_SUBMIT_ENABLED=${AUTO_SUBMIT_ENABLED}"
            echo "DRY_RUN=${DRY_RUN}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env

      - name: Ensure runtime directories exist
        run: mkdir -p data/sessions tmp

      # actions/cache never overwrites an existing exact-match key, so the primary
      # key includes run_id (always a miss -> always saves post-job) while
      # restore-keys prefix-matches the most recent prior run's cache to restore
      # the running consecutive-zero-result-runs counter. This is the standard
      # pattern for persisting small mutable state across ephemeral runners.
      - name: Restore zero-result-streak cache
        uses: actions/cache@v4
        with:
          path: data/zero-result-streak.json
          key: zero-result-streak-${{ github.run_id }}
          restore-keys: |
            zero-result-streak-

      # Same actions/cache pattern as zero-result-streak above, persisting the
      # 30/day hard application cap (lib/daily-cap.ts) across ephemeral runners.
      # Uses the SAME key prefix as cba-apply.yml's cache step so the count is
      # shared across ALL workflows/runs combined, not just this one.
      - name: Restore daily-application-count cache
        uses: actions/cache@v4
        with:
          path: data/daily-application-count.json
          key: daily-application-count-${{ github.run_id }}
          restore-keys: |
            daily-application-count-

      - name: Run bot
        id: bot
        # pipefail ensures the step fails if npm run seek exits non-zero,
        # even when piped through tee. The cookies b64 is written to
        # tmp/seek-cookies.b64 by saveSession — NOT captured in the log.
        shell: bash -eo pipefail {0}
        env:
          JOB_URL: ${{ github.event.inputs.job_url }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$JOB_URL" ]; then
            NORMALISED="$(node scripts/normalise-url.js "$JOB_URL")"
            echo "Single-job mode for: $NORMALISED"
            ARGS="--url $NORMALISED"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run seek -- $ARGS 2>&1 | tee tmp/bot.log

      - name: Update SEEK_SESSION_COOKIES secret
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # If session expired during this run, do NOT overwrite the secret — doing so
          # would replace any valid manually-set cookies with the stale cookies from
          # this failed run, locking out all future runs until a manual refresh.
          if [ -f tmp/session-expired ]; then
            echo "::warning::Session expired mid-run — SEEK_SESSION_COOKIES secret preserved. Re-run seek-login locally and update the secret manually."
            exit 0
          fi
          if [ ! -f tmp/seek-cookies.b64 ]; then
            echo "::warning::tmp/seek-cookies.b64 not found — session was not refreshed this run."
            exit 0
          fi
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT secret not set — cannot rotate SEEK_SESSION_COOKIES. Add a fine-grained PAT with repo + secrets scopes named GH_PAT."
            exit 0
          fi
          echo "$GH_PAT" | gh auth login --with-token
          gh secret set SEEK_SESSION_COOKIES --body "$(cat tmp/seek-cookies.b64)" --repo "${GITHUB_REPOSITORY}"
          echo "SEEK_SESSION_COOKIES rotated ($(wc -c < tmp/seek-cookies.b64) bytes base64)."

      - name: Run maintenance patch
        shell: bash -eo pipefail {0}
        run: npm run analyze 2>&1 | tee tmp/analyze.log

      # scripts/apply.ts writes tmp/run-summary.json (see lib/run-summary.ts)
      # in its finally block, so this runs regardless of whether the bot step
      # above succeeded or failed. Reuses those pre-computed numbers instead
      # of re-deriving them from logs.
      - name: Write job summary
        if: always()
        run: |
          if [ ! -f tmp/run-summary.json ]; then
            echo "## Seek Auto Apply — no run summary produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=$(jq -r '.status' tmp/run-summary.json)
          JOBS_FOUND=$(jq -r '.jobsFound' tmp/run-summary.json)
          APPLIED=$(jq -r '.applied' tmp/run-summary.json)
          SKIPPED=$(jq -r '.skipped' tmp/run-summary.json)
          FAILED=$(jq -r '.failed' tmp/run-summary.json)
          MESSAGE=$(jq -r '.message' tmp/run-summary.json)
          {
            echo "## Seek Auto Apply — **${STATUS}**"
            echo ""
            echo "- Jobs found: ${JOBS_FOUND}"
            echo "- Applied: ${APPLIED}"
            echo "- Skipped: ${SKIPPED}"
            echo "- Failed: ${FAILED}"
            echo "- ${MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional — only fires if the WEBHOOK_URL secret is set, and only on
      # WARN/FAIL so healthy runs never spam the channel. Discord incoming
      # webhook format ({"content": "..."}) also works unmodified for a Slack
      # incoming webhook URL. Silently skipped (no error) when unset.
      - name: Webhook alert on WARN/FAIL
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL not set — skipping webhook alert."
            exit 0
          fi
          if [ ! -f tmp/run-summary.json ]; then
            exit 0
          fi
          STATUS=$(jq -r '.status' tmp/run-summary.json)
          if [ "$STATUS" != "WARN" ] && [ "$STATUS" != "FAIL" ]; then
            echo "Status is ${STATUS} — no alert needed."
            exit 0
          fi
          MESSAGE=$(jq -r '.message' tmp/run-summary.json)
          APPLIED=$(jq -r '.applied' tmp/run-summary.json)
          JOBS_FOUND=$(jq -r '.jobsFound' tmp/run-summary.json)
          BODY=$(jq -n \
            --arg content "**Seek Auto Apply — ${STATUS}**: ${MESSAGE} (jobs found: ${JOBS_FOUND}, applied: ${APPLIED}) — run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK_URL" \
            || echo "::warning::Webhook POST failed — continuing (non-fatal)."

      # Runs on every execution (not just failure()) because getJobLinks now
      # captures a zero-links diagnostic screenshot even on runs that don't
      # cross the 3-consecutive-zero-result failure threshold — those
      # screenshots are still useful for catching a scraper break early.
      - name: Upload logs and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seek-bot-logs
          path: |
            tmp/bot.log
            tmp/analyze.log
            screenshots/errors/
          # Explicitly exclude seek-cookies.b64 — it contains live auth tokens.
          # The glob above only matches *.log and screenshots/, so it is already
          # excluded, but this comment documents the intent clearly.
          if-no-files-found: ignore
          retention-days: 7

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in tmp/bot.log tmp/analyze.log; do
            if [ -f "$f" ]; then
              echo "===== last 50 lines of $f ====="
              tail -n 50 "$f"
            fi
          done
