<!-- Regression fixture for the 2026-07-01 PageUp selector-drift incident
     (LEARNINGS.md "30-day audit... ats_pageup_no_submit persisting at 10-13/run").
     Old selector was `button:has-text("Submit"), #submitButton, input[value*="Submit" i]`
     — a tenant using "Send application" copy with a data-test-id attribute (no
     literal "Submit" text, no matching id/value) was invisible to it. The
     broadened PAGEUP_SUBMIT_SELECTOR added `button:has-text("Send application")`
     and `[data-test-id*="submit" i]` to close this gap. -->
<!DOCTYPE html>
<html>
<body>
  <form>
    <button type="button" data-test-id="apply-cta">Send application</button>
  </form>
</body>
</html>
