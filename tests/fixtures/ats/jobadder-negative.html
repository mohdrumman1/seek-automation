<!-- Regression fixture for the 2026-07-01 JobAdder selector-drift incident
     (LEARNINGS.md "JobAdder/Cornerstone/Teamtailor/Workday intermittent submit
     failures from similar selector drift"). Old selector was
     `button:has-text("Submit application"), button:has-text("Submit Application"),
     button:has-text("Apply"), button[type="submit"]` — a tenant rendering the
     submit control as a native `<input type="submit">` (no wrapping <button>,
     no literal "Submit"/"Apply" text visible via has-text on an input) was
     invisible to it. The broadened JOBADDER_SUBMIT_SELECTOR added
     `input[type="submit"]` to close this gap. -->
<!DOCTYPE html>
<html>
<body>
  <form>
    <input type="submit" value="Send" />
  </form>
</body>
</html>
