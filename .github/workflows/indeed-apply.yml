# DISABLED 2026-06-02 — Cloudflare IP block on Actions runners. See LEARNINGS.md "Indeed zero-jobs on CI" (2026-05-29). Re-enable when residential proxy is wired.
name: Indeed Auto Apply

on:
  # Disabled 2026-05-29: Cloudflare IP-blocks Actions runners. See LEARNINGS.md "Indeed cron disabled". Re-enable when residential proxy is wired (INDEED_PROXY_URL).
  # schedule:
  #   - cron: '17 20 * * *'
  #   - cron: '17 2 * * *'
  #   - cron: '17 8 * * *'
  # Disabled 2026-06-02: workflow_dispatch removed so the workflow cannot run accidentally. Restore the block below + uncomment schedule when residential proxy is wired.
  # workflow_dispatch:
  #   inputs:
  #     dry_run:
  #       description: 'Dry run — fill but do not submit'
  #       required: false
  #       type: boolean
  #       default: false
  workflow_dispatch: # placeholder — required by GitHub Actions syntax. Job body has `if: false` guard so nothing executes even if triggered.


concurrency:
  group: indeed-apply
  cancel-in-progress: false

jobs:
  apply:
    # DISABLED 2026-06-02 — hard `if: false` guard so the job is skipped even if workflow_dispatch is triggered manually. Remove this guard (restore the original condition) when re-enabling.
    if: false
    # if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'google/gemini-2.5-flash'
      SEEK_EMAIL: ${{ secrets.SEEK_EMAIL }}
      SEEK_SESSION_COOKIES: ${{ secrets.SEEK_SESSION_COOKIES }}
      CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      CANDIDATE_LINKEDIN: ${{ secrets.CANDIDATE_LINKEDIN }}
      CANDIDATE_WEBSITE: ${{ secrets.CANDIDATE_WEBSITE }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}
      WORKDAY_PASSWORD_FALLBACK: ${{ secrets.WORKDAY_PASSWORD_FALLBACK }}
      INDEED_SESSION_COOKIES: ${{ secrets.INDEED_SESSION_COOKIES }}
      SEEK_DISABLED: 'true'
      INDEED_ENABLED: 'true'
      MAX_APPS_PER_RUN: '100'
      MAX_APPS_PER_SEARCH: '30'
      RESUME_TAILORING_ENABLED: 'true'
      AUTO_SUBMIT_ENABLED: 'true'
      DRY_RUN: 'false'
      LOG_LEVEL: 'info'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system deps
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          {
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "OPENROUTER_MODEL=${OPENROUTER_MODEL}"
            echo "SEEK_EMAIL=${SEEK_EMAIL}"
            echo "CANDIDATE_PHONE=${CANDIDATE_PHONE}"
            echo "CANDIDATE_LINKEDIN=${CANDIDATE_LINKEDIN}"
            echo "CANDIDATE_WEBSITE=${CANDIDATE_WEBSITE}"
            echo "WORKDAY_PASSWORD=${WORKDAY_PASSWORD}"
            echo "WORKDAY_PASSWORD_FALLBACK=${WORKDAY_PASSWORD_FALLBACK}"
            echo "MAX_APPS_PER_RUN=${MAX_APPS_PER_RUN}"
            echo "MAX_APPS_PER_SEARCH=${MAX_APPS_PER_SEARCH}"
            echo "RESUME_TAILORING_ENABLED=${RESUME_TAILORING_ENABLED}"
            echo "AUTO_SUBMIT_ENABLED=${AUTO_SUBMIT_ENABLED}"
            echo "DRY_RUN=${DRY_RUN}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env

      - name: Ensure runtime directories exist
        run: mkdir -p data/sessions tmp

      - name: Run bot
        id: bot
        shell: bash -eo pipefail {0}
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="--dry-run"
          fi
          npm run seek -- $ARGS 2>&1 | tee tmp/bot.log

      - name: Run maintenance patch
        shell: bash -eo pipefail {0}
        run: npm run analyze 2>&1 | tee tmp/analyze.log

      - name: Upload logs and debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: indeed-bot-logs
          path: |
            tmp/bot.log
            tmp/analyze.log
          # Screenshots may capture completed-form PII, so retain them only on
          # runner disk for troubleshooting and never upload them as artifacts.
          if-no-files-found: ignore
          retention-days: 7

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in tmp/bot.log tmp/analyze.log; do
            if [ -f "$f" ]; then
              echo "===== last 50 lines of $f ====="
              tail -n 50 "$f"
            fi
          done
