name: Seek Auto Apply

on:
  schedule:
    # 6:17am, 12:17pm, 6:17pm AEST (UTC+10)
    - cron: '17 20 * * *'
    - cron: '17 2 * * *'
    - cron: '17 8 * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system deps
        run: npx playwright install --with-deps chromium

      - name: Create .env
        run: |
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" > .env
          echo "SEEK_EMAIL=${{ secrets.SEEK_EMAIL }}" >> .env

      - name: Ensure data directory exists
        run: mkdir -p data

      - name: Run bot
        run: npm run seek
        continue-on-error: true

      - name: Run maintenance patch (update KB from review queue)
        run: npm run analyze
        continue-on-error: true

      - name: Commit updated data back to repo
        run: |
          git config user.name "seek-bot"
          git config user.email "seek-bot@noreply.github.com"
          git add data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "bot: update data [skip ci]"
          git push
