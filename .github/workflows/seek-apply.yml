name: Seek Auto Apply

on:
  schedule:
    # 6:17am, 12:17pm, 6:17pm AEST (UTC+10) — note: times shift 1h during AEDT (Oct–Apr)
    - cron: '17 20 * * *'
    - cron: '17 2 * * *'
    - cron: '17 8 * * *'
  workflow_dispatch:
    inputs:
      job_url:
        description: 'SEEK job URL to apply to (leave blank for normal search loop)'
        required: false
        type: string
      dry_run:
        description: 'Dry run — fill but do not submit'
        required: false
        type: boolean
        default: false

concurrency:
  group: seek-apply
  cancel-in-progress: false

jobs:
  apply:
    # Schedule always fires on the default branch (main). This guard also
    # prevents accidental workflow_dispatch runs from develop or feature branches.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SEEK_EMAIL: ${{ secrets.SEEK_EMAIL }}
      SEEK_SESSION_COOKIES: ${{ secrets.SEEK_SESSION_COOKIES }}
      CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      CANDIDATE_LINKEDIN: ${{ secrets.CANDIDATE_LINKEDIN }}
      CANDIDATE_WEBSITE: ${{ secrets.CANDIDATE_WEBSITE }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}
      INDEED_SESSION_COOKIES: ${{ secrets.INDEED_SESSION_COOKIES }}
      INDEED_ENABLED: 'true'
      MAX_APPS_PER_RUN: '100'
      MAX_APPS_PER_SEARCH: '30'
      RESUME_TAILORING_ENABLED: 'true'
      AUTO_SUBMIT_ENABLED: 'true'
      DRY_RUN: 'false'
      LOG_LEVEL: 'info'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system deps
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          {
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "SEEK_EMAIL=${SEEK_EMAIL}"
            echo "CANDIDATE_PHONE=${CANDIDATE_PHONE}"
            echo "CANDIDATE_LINKEDIN=${CANDIDATE_LINKEDIN}"
            echo "CANDIDATE_WEBSITE=${CANDIDATE_WEBSITE}"
            echo "WORKDAY_PASSWORD=${WORKDAY_PASSWORD}"
            echo "MAX_APPS_PER_RUN=${MAX_APPS_PER_RUN}"
            echo "MAX_APPS_PER_SEARCH=${MAX_APPS_PER_SEARCH}"
            echo "RESUME_TAILORING_ENABLED=${RESUME_TAILORING_ENABLED}"
            echo "AUTO_SUBMIT_ENABLED=${AUTO_SUBMIT_ENABLED}"
            echo "DRY_RUN=${DRY_RUN}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env

      - name: Ensure runtime directories exist
        run: mkdir -p data/sessions tmp

      - name: Run bot
        id: bot
        # pipefail ensures the step fails if npm run seek exits non-zero,
        # even when piped through tee. The cookies b64 is written to
        # tmp/seek-cookies.b64 by saveSession — NOT captured in the log.
        shell: bash -eo pipefail {0}
        env:
          JOB_URL: ${{ github.event.inputs.job_url }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ -n "$JOB_URL" ]; then
            NORMALISED="$(node scripts/normalise-url.js "$JOB_URL")"
            echo "Single-job mode for: $NORMALISED"
            ARGS="--url $NORMALISED"
          fi
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run seek -- $ARGS 2>&1 | tee tmp/bot.log

      - name: Update SEEK_SESSION_COOKIES secret
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # If session expired during this run, do NOT overwrite the secret — doing so
          # would replace any valid manually-set cookies with the stale cookies from
          # this failed run, locking out all future runs until a manual refresh.
          if [ -f tmp/session-expired ]; then
            echo "::warning::Session expired mid-run — SEEK_SESSION_COOKIES secret preserved. Re-run seek-login locally and update the secret manually."
            exit 0
          fi
          if [ ! -f tmp/seek-cookies.b64 ]; then
            echo "::warning::tmp/seek-cookies.b64 not found — session was not refreshed this run."
            exit 0
          fi
          if [ -z "$GH_PAT" ]; then
            echo "::warning::GH_PAT secret not set — cannot rotate SEEK_SESSION_COOKIES. Add a fine-grained PAT with repo + secrets scopes named GH_PAT."
            exit 0
          fi
          echo "$GH_PAT" | gh auth login --with-token
          gh secret set SEEK_SESSION_COOKIES --body "$(cat tmp/seek-cookies.b64)" --repo "${GITHUB_REPOSITORY}"
          echo "SEEK_SESSION_COOKIES rotated ($(wc -c < tmp/seek-cookies.b64) bytes base64)."

      - name: Run maintenance patch
        shell: bash -eo pipefail {0}
        run: npm run analyze 2>&1 | tee tmp/analyze.log

      - name: Commit updated data back to repo
        if: always()
        run: |
          git config user.name "seek-bot"
          git config user.email "seek-bot@noreply.github.com"
          git add \
            data/applied_jobs.json \
            data/questions_kb.json \
            data/review-queue.json \
            data/error-log.json \
            data/applications.csv \
            data/skipped_jobs.csv \
            data/failed_jobs.csv \
            data/runs.csv \
            data/sr-queue.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "bot: update data [skip ci]"
            # Pull --rebase before pushing so the bot's data commit lands on top
            # of any code changes pushed while the run was in progress.
            # Data files (JSON/CSV) never conflict with code files (ts/yml).
            git pull --rebase origin main
            git push
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: seek-bot-logs
          path: |
            tmp/bot.log
            tmp/analyze.log
            screenshots/errors/
          # Explicitly exclude seek-cookies.b64 — it contains live auth tokens.
          # The glob above only matches *.log and screenshots/, so it is already
          # excluded, but this comment documents the intent clearly.
          if-no-files-found: ignore
          retention-days: 7

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in tmp/bot.log tmp/analyze.log; do
            if [ -f "$f" ]; then
              echo "===== last 50 lines of $f ====="
              tail -n 50 "$f"
            fi
          done
