name: CBA Careers Auto Apply

on:
  schedule:
    # 6:47am, 12:47pm, 6:47pm AEST — staggered 30 min from seek-apply.yml to avoid concurrent runner contention
    - cron: '47 20 * * *'
    - cron: '47 2 * * *'
    - cron: '47 8 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — fill but do not submit'
        required: false
        type: boolean
        default: false

concurrency:
  group: job-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'google/gemini-2.5-flash'
      SEEK_EMAIL: ${{ secrets.SEEK_EMAIL }}
      SEEK_SESSION_COOKIES: ${{ secrets.SEEK_SESSION_COOKIES }}
      CANDIDATE_PHONE: ${{ secrets.CANDIDATE_PHONE }}
      CANDIDATE_LINKEDIN: ${{ secrets.CANDIDATE_LINKEDIN }}
      CANDIDATE_WEBSITE: ${{ secrets.CANDIDATE_WEBSITE }}
      WORKDAY_PASSWORD: ${{ secrets.WORKDAY_PASSWORD }}
      WORKDAY_PASSWORD_FALLBACK: ${{ secrets.WORKDAY_PASSWORD_FALLBACK }}
      # Lowered from 20/10, then again from 8/4 — this workflow draws from the
      # same shared 30/day hard cap (lib/daily-cap.ts) as seek-apply.yml, so a
      # single CBA run should not be able to consume most of that budget by itself.
      MAX_APPS_PER_RUN: '6'
      MAX_APPS_PER_SEARCH: '4'
      RESUME_TAILORING_ENABLED: 'true'
      AUTO_SUBMIT_ENABLED: 'true'
      DRY_RUN: 'false'
      LOG_LEVEL: 'info'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright + system deps
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets
        run: |
          {
            echo "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}"
            echo "OPENROUTER_MODEL=${OPENROUTER_MODEL}"
            echo "SEEK_EMAIL=${SEEK_EMAIL}"
            echo "CANDIDATE_PHONE=${CANDIDATE_PHONE}"
            echo "CANDIDATE_LINKEDIN=${CANDIDATE_LINKEDIN}"
            echo "CANDIDATE_WEBSITE=${CANDIDATE_WEBSITE}"
            echo "WORKDAY_PASSWORD=${WORKDAY_PASSWORD}"
            echo "WORKDAY_PASSWORD_FALLBACK=${WORKDAY_PASSWORD_FALLBACK}"
            echo "MAX_APPS_PER_RUN=${MAX_APPS_PER_RUN}"
            echo "MAX_APPS_PER_SEARCH=${MAX_APPS_PER_SEARCH}"
            echo "RESUME_TAILORING_ENABLED=${RESUME_TAILORING_ENABLED}"
            echo "AUTO_SUBMIT_ENABLED=${AUTO_SUBMIT_ENABLED}"
            echo "DRY_RUN=${DRY_RUN}"
            echo "LOG_LEVEL=${LOG_LEVEL}"
          } > .env

      - name: Ensure runtime directories exist
        run: mkdir -p data/sessions tmp

      # Same actions/cache pattern + key prefix as seek-apply.yml, so the 30/day
      # hard application cap (lib/daily-cap.ts) is shared across ALL workflows
      # combined, not just this one. company-apply.ts reserves quota before its
      # final submit click too.
      - name: Restore daily-application-count cache
        uses: actions/cache@v4
        with:
          path: data/daily-application-count.json
          key: daily-application-count-${{ github.run_id }}
          restore-keys: |
            daily-application-count-

      - name: Restore weekly stats cache
        uses: actions/cache@v4
        with:
          path: data/weekly-stats.json
          key: weekly-stats-${{ github.run_id }}
          restore-keys: |
            weekly-stats-

      - name: Run CBA crawler
        id: bot
        shell: bash -eo pipefail {0}
        env:
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS="--company cba"
          if [ "$DRY_RUN_INPUT" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          npm run company -- $ARGS 2>&1 | tee tmp/cba-bot.log

      # scripts/company-apply.ts writes tmp/run-summary.json (see
      # lib/run-summary.ts) in its finally block, same as seek-apply.yml.
      - name: Write job summary
        if: always()
        run: |
          if [ ! -f tmp/run-summary.json ]; then
            echo "## CBA Careers Auto Apply — no run summary produced" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS=$(jq -r '.status' tmp/run-summary.json)
          JOBS_FOUND=$(jq -r '.jobsFound' tmp/run-summary.json)
          APPLIED=$(jq -r '.applied' tmp/run-summary.json)
          SKIPPED=$(jq -r '.skipped' tmp/run-summary.json)
          FAILED=$(jq -r '.failed' tmp/run-summary.json)
          MESSAGE=$(jq -r '.message' tmp/run-summary.json)
          {
            echo "## CBA Careers Auto Apply — **${STATUS}**"
            echo ""
            echo "- Jobs found: ${JOBS_FOUND}"
            echo "- Applied: ${APPLIED}"
            echo "- Skipped: ${SKIPPED}"
            echo "- Failed: ${FAILED}"
            echo "- ${MESSAGE}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Optional — only fires if the WEBHOOK_URL secret is set, and only on
      # WARN/FAIL. Same pattern as seek-apply.yml. Silently skipped (no error)
      # when unset.
      - name: Webhook alert on WARN/FAIL
        if: always()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "WEBHOOK_URL not set — skipping webhook alert."
            exit 0
          fi
          if [ ! -f tmp/run-summary.json ]; then
            exit 0
          fi
          STATUS=$(jq -r '.status' tmp/run-summary.json)
          if [ "$STATUS" != "WARN" ] && [ "$STATUS" != "FAIL" ]; then
            echo "Status is ${STATUS} — no alert needed."
            exit 0
          fi
          MESSAGE=$(jq -r '.message' tmp/run-summary.json)
          APPLIED=$(jq -r '.applied' tmp/run-summary.json)
          JOBS_FOUND=$(jq -r '.jobsFound' tmp/run-summary.json)
          BODY=$(jq -n \
            --arg content "**CBA Careers Auto Apply — ${STATUS}**: ${MESSAGE} (jobs found: ${JOBS_FOUND}, applied: ${APPLIED}) — run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{content: $content}')
          curl -sf -X POST -H "Content-Type: application/json" -d "$BODY" "$WEBHOOK_URL" \
            || echo "::warning::Webhook POST failed — continuing (non-fatal)."

      - name: Upload logs and debug artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cba-bot-logs
          path: tmp/cba-bot.log
          # Screenshots may capture completed-form PII, so retain them only on
          # runner disk for troubleshooting and never upload them as artifacts.
          if-no-files-found: ignore
          retention-days: 7

      - name: Tail logs on failure
        if: failure()
        run: |
          for f in tmp/cba-bot.log; do
            if [ -f "$f" ]; then
              echo "===== last 50 lines of $f ====="
              tail -n 50 "$f"
            fi
          done
